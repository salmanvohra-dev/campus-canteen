<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Status – SmartBite</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc; /* Light gray/white background */
      color: #0f172a; /* Dark gray text */
      padding: 1rem;
    }
    .card {
      background: #ffffff; /* White card */
      border: 1px solid #fee2e2; /* Light red border */
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(220, 38, 38, 0.08); /* Soft red shadow */
    }
    .icon-wrap {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1.25rem;
    }
    /* Red theme for Paid instead of green */
    .icon-paid   { background: #fee2e2; color: #dc2626; } 
    /* Amber theme for Pending */
    .icon-pending { background: #fef3c7;  color: #d97706; } 
    
    h1 { font-size: 1.75rem; font-weight: 900; margin-bottom: .5rem; color: #111827; }
    .meta { font-size: .8rem; color: #64748b; margin-bottom: 1.5rem; }
    .meta span { color: #334155; font-weight: 700; }

    /* Token box - Red Theme */
    .token-box {
      border: 2px solid rgba(220, 38, 38, 0.3);
      border-radius: 1rem;
      padding: 1.25rem 1rem;
      margin: 1.25rem 0;
      background: rgba(220, 38, 38, 0.05);
    }
    .token-label { font-size: .65rem; letter-spacing: .15em; text-transform: uppercase; color: #dc2626; font-weight: 700; margin-bottom: .4rem; }
    .token-value { font-size: 3rem; font-weight: 900; letter-spacing: .2em; color: #b91c1c; }

    /* Pending box - Amber Theme */
    .pending-box {
      border: 2px solid rgba(217, 119, 6, 0.3);
      border-radius: 1rem;
      padding: 1.25rem 1rem;
      margin: 1.25rem 0;
      background: rgba(217, 119, 6, 0.05);
    }
    .pending-box p { color: #b45309; font-size: .9rem; font-weight: 700; }
    .pulse-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d97706;
      margin-right: 6px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Back Button - Red Theme */
    .back-btn {
      display: inline-block;
      margin-top: 1.5rem;
      background: #dc2626; /* Red-600 */
      color: #fff;
      font-weight: 700;
      padding: .75rem 2rem;
      border-radius: .875rem;
      text-decoration: none;
      transition: background .2s;
    }
    .back-btn:hover { background: #b91c1c; } /* Red-700 on hover */
    #errorMsg { color: #dc2626; font-size: .9rem; margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon-wrap icon-pending" id="iconWrap">
      <i class="fa-solid fa-clock" id="iconEl"></i>
    </div>
    <h1 id="heading">Loading…</h1>
    <p class="meta" id="meta"></p>

    <div id="tokenBox" class="token-box" style="display:none">
      <div class="token-label">Your Pickup Token</div>
      <div class="token-value" id="tokenVal">------</div>
    </div>

    <div id="pendingBox" class="pending-box" style="display:none">
      <p><span class="pulse-dot"></span>Awaiting payment verification…</p>
    </div>

    <div id="errorMsg"></div>
    <a href="javascript:void(0)" onclick="goBack()" class="back-btn">Back to Menu</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    let pollTimer = null;

    function showPaid(order) {
      document.getElementById('iconWrap').className = 'icon-wrap icon-paid';
      document.getElementById('iconEl').className = 'fa-solid fa-circle-check';
      document.getElementById('heading').textContent = 'Order Confirmed! 🎉';
      // Changed inline color to match red theme
      document.getElementById('meta').innerHTML =
        `Order ID: <span>${order.orderId}</span> &nbsp;|&nbsp; Status: <span style="color:#dc2626">Paid</span>`;
      document.getElementById('tokenVal').textContent = order.token || '------';
      document.getElementById('tokenBox').style.display = 'block';
      document.getElementById('pendingBox').style.display = 'none';
    }

    function showPending(order) {
      document.getElementById('heading').textContent = 'Order Placed!';
      // Changed inline color to match amber pending theme
      document.getElementById('meta').innerHTML =
        `Order ID: <span>${order.orderId}</span> &nbsp;|&nbsp; Status: <span style="color:#d97706">Pending</span>`;
      document.getElementById('tokenBox').style.display = 'none';
      document.getElementById('pendingBox').style.display = 'block';
    }

    async function fetchOrder() {
      const res = await fetch(`/api/orders/${id}`);
      const data = await res.json();
      if (!data.success) throw new Error(data.message);
      return data.order;
    }

    async function init() {
      if (!id) {
        document.getElementById('heading').textContent = 'Invalid Order Link';
        return;
      }
      try {
        const order = await fetchOrder();
        if (order.paymentStatus === 'Paid') {
          showPaid(order);
        } else {
          showPending(order);
          pollTimer = setInterval(async () => {
            try {
              const updated = await fetchOrder();
              if (updated.paymentStatus === 'Paid') {
                clearInterval(pollTimer);
                showPaid(updated);
              }
            } catch (_) {}
          }, 5000);
        }
      } catch (err) {
        document.getElementById('heading').textContent = 'Order Not Found';
        document.getElementById('errorMsg').textContent = err.message;
      }
    }

    init();

    function goBack() {
      const name = sessionStorage.getItem('studentName');
      window.location.href = name ? `/?name=${encodeURIComponent(name)}` : '/';
    }
  </script>
</body>
</html>
